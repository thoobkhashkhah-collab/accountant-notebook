<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1729">
<meta name="color-scheme" content="light dark">
<title>عُهدة برو — نظام المصروفات والعهد</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='white' font-family='Tahoma'%3E%D8%B9%3C/text%3E%3C/svg%3E">
<style>
:root{--f:"Noto Naskh Arabic","Amiri","Traditional Arabic","Segoe UI",serif;--bg:#eef2f7;--card:#fff;--card2:#f7f9fc;--ink:#0d1f33;--ink2:#34495f;--mut:#6b7f95;--line:#e2e9f1;--line2:#d2dce8;--br:#2563eb;--br2:#1d4ed8;--brs:#e8efff;--in:#059669;--ins:#e3f7ee;--out:#dc2626;--outs:#fdecec;--gold:#b7791f;--golds:#fff4dc;--vio:#7c3aed;--vios:#f1eaff;--side:#0b1729;--side2:#13243d;--sh:0 1px 2px #0d1f330d,0 6px 20px #0d1f330f;--shl:0 30px 80px #0b172955;--r:18px}
[data-theme=dark]{--bg:#081120;--card:#0f1b2d;--card2:#13223a;--ink:#e7eef8;--ink2:#c2d1e3;--mut:#8aa0b8;--line:#1d2e47;--line2:#2a3f5e;--brs:#14284d;--ins:#0b3326;--outs:#3b1717;--golds:#3a2b0b;--vios:#261b48;--side:#050c18;--side2:#0c1a30;--sh:0 1px 2px #0006,0 8px 24px #0005}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:14px;font-weight:700;line-height:1.65;-webkit-font-smoothing:antialiased;font-synthesis:weight style}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--br)}
.num{font-variant-numeric:lining-nums tabular-nums;direction:ltr;unicode-bidi:isolate;font-feature-settings:"lnum","tnum"}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}.hide{display:none!important}.grow{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
.c-in{color:var(--in)}.c-out{color:var(--out)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
.lay{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--side),var(--side2));color:#b8c8dc;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:3px}
.logo{display:flex;gap:11px;align-items:center;padding:4px 8px 18px}
.mark{width:42px;height:42px;border-radius:13px;background:conic-gradient(from 210deg,#22c55e,#2563eb,#7c3aed,#22c55e);display:grid;place-items:center;color:#fff;font-weight:900;font-size:21px;box-shadow:0 8px 24px #2563eb55}
.logo b{display:block;color:#fff;font-size:17px}.logo span{font-size:11.5px;opacity:.75}
.nh{font-size:11px;letter-spacing:.5px;opacity:.55;padding:12px 12px 4px}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:inherit;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:right;transition:.15s}
.nav:hover{background:#ffffff10;color:#fff}.nav.on{background:linear-gradient(90deg,#2563eb33,#2563eb66);color:#fff;box-shadow:inset -3px 0 0 #60a5fa}
.nav .cnt{margin-inline-start:auto;font-size:11px;background:#ffffff1a;border-radius:20px;padding:0 8px}
.sfoot{margin-top:auto;padding:14px 10px 4px;font-size:11.5px;opacity:.7;border-top:1px solid #ffffff14}
.sfoot b{display:block;color:#fff;opacity:.95;font-size:13px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0}
.gs{position:relative;width:min(340px,34vw)}.gs input{width:100%;padding:9px 38px 9px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--card)}
.gs svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--mut)}
.content{padding:22px;max-width:1400px;width:100%;margin:0 auto}
.burger{display:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--card);padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:600;white-space:nowrap;transition:.15s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--br);color:var(--br)}.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,var(--br),var(--br2));border-color:transparent;color:#fff!important;box-shadow:0 6px 16px #2563eb40}
.btn-in{background:linear-gradient(135deg,#10b981,#047857);border-color:transparent;color:#fff!important}
.btn-out{background:linear-gradient(135deg,#ef4444,#b91c1c);border-color:transparent;color:#fff!important}
.btn-d{color:var(--out)!important}.btn-g{background:none;border-color:transparent}.btn-s{padding:6px 10px;font-size:13px;border-radius:10px}
.btn-i{padding:7px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* compact dual-calendar clock in the page header */
.clock-header{display:flex;align-items:center;gap:8px;flex:none;padding:5px 9px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(135deg,var(--card),var(--card2));box-shadow:0 4px 14px #0b172914}
.clock-dates{display:flex;flex-direction:column;gap:1px;line-height:1.25;min-width:0}
.clock-header .date{font-size:10px;font-weight:700;white-space:nowrap}
.clock-header #clock-hijri{color:#047857}.clock-header #clock-greg{color:#1d4ed8}
.clock-header .clock-time{position:relative;overflow:hidden;white-space:nowrap;padding:5px 8px;border-radius:9px;font-size:11px;font-weight:900;color:#fff;background:linear-gradient(135deg,#1e3a8a,#2563eb);box-shadow:0 5px 14px #2563eb40;direction:ltr;unicode-bidi:isolate;letter-spacing:.4px;animation:clockFloat 2.8s ease-in-out infinite}
.clock-header .clock-time:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#86efac;margin-inline-end:6px;vertical-align:middle;box-shadow:0 0 0 0 #86efac88;animation:clockBeat 1.4s ease-out infinite}
@keyframes clockFloat{0%,100%{transform:translateY(0);box-shadow:0 5px 14px #2563eb40}50%{transform:translateY(-2px);box-shadow:0 9px 22px #2563eb70}}
@keyframes clockBeat{0%{box-shadow:0 0 0 0 #86efac99;opacity:1}70%{box-shadow:0 0 0 7px #86efac00;opacity:.75}100%{box-shadow:0 0 0 0 #86efac00;opacity:1}}
@media(prefers-reduced-motion:reduce){.clock-header .clock-time,.clock-header .clock-time:before{animation:none}}
[data-theme=dark] .clock-header{background:linear-gradient(135deg,var(--card),var(--card2))}
[data-theme=dark] .clock-header #clock-hijri{color:#a7f3d0}[data-theme=dark] .clock-header #clock-greg{color:#bfdbfe}
@media(max-width:820px){.clock-header{gap:5px;padding:3px 5px;border-radius:10px}.clock-header .date{font-size:8.5px}.clock-header .clock-time{font-size:9px;padding:4px 6px}.clock-header .clock-time:before{width:5px;height:5px;margin-inline-end:4px}.top{gap:6px}}
@media(max-width:380px){.top h1{font-size:13px;max-width:65px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.clock-header{gap:4px;padding:3px}.clock-header .date{font-size:8px}.clock-header .clock-time{font-size:8.5px;padding:4px 5px}}
.logo-preview{max-width:220px;max-height:70px;object-fit:contain;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}.logo-empty{min-width:120px;padding:10px 14px;border:1px dashed var(--line2);border-radius:10px;color:var(--mut);font-size:12px;text-align:center}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mt{margin-top:16px}
.kpi{position:relative;overflow:hidden}.kpi .l{color:var(--mut);font-size:12.5px;display:flex;gap:6px;align-items:center}.kpi .v{font-size:25px;font-weight:800;margin-top:4px}.kpi .s{font-size:12px;color:var(--mut)}
.kpi:after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--k,var(--brs));opacity:.55}
.kpi>*{position:relative;z-index:1}.kpi.k-in{--k:var(--ins)}.kpi.k-out{--k:var(--outs)}.kpi.k-bal{--k:var(--brs)}.kpi.k-v{--k:var(--vios)}
.hero{background:radial-gradient(1200px 300px at 100% 0,#2563eb,transparent),linear-gradient(135deg,#0b1729,#1e3a8a);color:#fff;border:0;padding:22px}
.hero h2{margin:0 0 4px;font-size:21px}.hero p{margin:0;opacity:.8}
.qbar{display:flex;gap:8px;margin-top:14px;background:#ffffff14;border:1px solid #ffffff2a;border-radius:14px;padding:6px}
.qbar input{flex:1;border:0;background:none;color:#fff;padding:8px 10px;outline:0;min-width:0}.qbar input::placeholder{color:#c7d6f5}
.qbar .btn{background:#ffffff1f;border-color:transparent;color:#fff}.qbar .btn:hover{background:#ffffff33;color:#fff}
.mic.rec{background:#ef4444!important;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ef444433}}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bigbtn{border:0;border-radius:16px;padding:14px;color:#fff;cursor:pointer;text-align:right;display:flex;gap:12px;align-items:center;font-weight:700;font-size:15px;transition:.2s}
.bigbtn:hover{transform:translateY(-2px)}.bigbtn small{display:block;font-weight:400;opacity:.85;font-size:12px}
.bigbtn.in{background:linear-gradient(135deg,#10b981,#047857)}.bigbtn.out{background:linear-gradient(135deg,#f43f5e,#b91c1c)}
.bigbtn .ic{width:40px;height:40px;border-radius:12px;background:#ffffff26;display:grid;place-items:center}
/* badges */
.bd{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:30px;font-size:12px;font-weight:700;white-space:nowrap}
.bd-in{background:var(--ins);color:var(--in)}.bd-out{background:var(--outs);color:var(--out)}.bd-g{background:var(--card2);color:var(--mut);border:1px solid var(--line)}.bd-w{background:var(--golds);color:var(--gold)}.bd-v{background:var(--vios);color:var(--vio)}.bd-b{background:var(--brs);color:var(--br)}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px}
table.t{width:100%;border-collapse:collapse;background:var(--card)}
.t th{position:sticky;top:0;background:var(--card2);font-size:12px;color:var(--mut);font-weight:700;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--card2)}
.t tfoot td{font-weight:800;background:var(--card2)}
.t td.in{color:var(--in);font-weight:700}.t td.out{color:var(--out);font-weight:700}
.t tr.draft td{opacity:.6}
/* forms */
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fd{display:flex;flex-direction:column;gap:5px;min-width:0}.fd.full{grid-column:1/-1}
.fd label{font-size:12.5px;font-weight:700;color:var(--ink2)}
.fd .h{font-size:11.5px;color:var(--mut)}
input.in,select.in,textarea.in,.fd input,.fd select,.fd textarea{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:11px;background:var(--card);outline:0;transition:.15s}
.fd input:focus,.fd select:focus,.fd textarea:focus,input.in:focus,select.in:focus{border-color:var(--br);box-shadow:0 0 0 4px #2563eb22}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .in{width:auto;min-width:130px;padding:8px 10px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kind button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px;cursor:pointer;text-align:right;display:flex;gap:10px;align-items:center;transition:.15s}
.kind button b{display:block;font-size:16px}.kind button small{color:var(--mut)}
.kind button .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card2)}
.kind button.on.in{border-color:var(--in);background:var(--ins)}.kind button.on.in .ic{background:var(--in);color:#fff}
.kind button.on.out{border-color:var(--out);background:var(--outs)}.kind button.on.out .ic{background:var(--out);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:30px;padding:5px 11px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip:hover{border-color:var(--br)}
.amt{font-size:22px!important;font-weight:800;text-align:left}
.tafq{font-size:12px;color:var(--in);min-height:18px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
.switch input{appearance:none;width:38px;height:22px;border-radius:20px;background:var(--line2);position:relative;cursor:pointer;transition:.2s;padding:0!important;border:0!important;flex:none}
.switch input:after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--br)}.switch input:checked:after{right:19px}
.drop{border:2px dashed var(--line2);border-radius:18px;padding:26px;text-align:center;cursor:pointer;transition:.2s;background:var(--card2)}
.drop:hover,.drop.over{border-color:var(--br);background:var(--brs)}
.drop .ic{width:56px;height:56px;margin:0 auto 8px;border-radius:16px;background:var(--brs);color:var(--br);display:grid;place-items:center}
.fmts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
/* list items */
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.bar{height:7px;border-radius:9px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;border-radius:9px;background:var(--br)}
.ccard{cursor:pointer;transition:.2s}.ccard:hover{transform:translateY(-3px);box-shadow:0 14px 34px #0d1f331f}
.ccard .bal{font-size:22px;font-weight:800}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:13px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.alert.w{background:var(--golds);border-color:#f59e0b55}.alert.e{background:var(--outs);border-color:#ef444455}.alert.ok{background:var(--ins);border-color:#10b98155}.alert.i{background:var(--brs);border-color:#2563eb44}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .ic{width:70px;height:70px;border-radius:22px;margin:0 auto 12px;display:grid;place-items:center;background:var(--brs);color:var(--br)}
/* modal */
.ov{position:fixed;inset:0;background:#06101fb3;backdrop-filter:blur(5px);z-index:100;display:grid;place-items:center;padding:16px;animation:fi .15s}
.md{background:var(--card);border-radius:22px;box-shadow:var(--shl);width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:pu .2s}
.md.s{width:min(500px,100%)}.md.l{width:min(1000px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}.mh h2{margin:0;font-size:17px;display:flex;gap:8px;align-items:center}
.mb{padding:18px 20px;overflow:auto}.mf{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
@keyframes fi{from{opacity:0}}@keyframes pu{from{transform:translateY(14px) scale(.98);opacity:0}}
.toasts{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#0b1729;color:#fff;padding:11px 16px;border-radius:13px;box-shadow:var(--shl);display:flex;gap:10px;align-items:center;animation:pu .2s;max-width:380px}
.toast.ok{border-inline-start:4px solid #10b981}.toast.err{border-inline-start:4px solid #ef4444}
.toast button{background:#ffffff22;border:0;color:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;font-weight:700}
/* voucher preview */
.vdoc{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vdoc .vh{padding:16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.vdoc.in .vh{background:linear-gradient(135deg,#059669,#065f46)}.vdoc.out .vh{background:linear-gradient(135deg,#dc2626,#7f1d1d)}
.vdoc .vh .a{font-size:26px;font-weight:900}
.vdoc dl{display:grid;grid-template-columns:130px 1fr;margin:0;padding:6px 16px}
.vdoc dt,.vdoc dd{padding:8px 0;border-bottom:1px dashed var(--line);margin:0}.vdoc dt{color:var(--mut);font-size:12.5px}
.attimg{max-width:100%;max-height:340px;border-radius:12px;border:1px solid var(--line);display:block;margin:auto}
/* charts */
.chart svg:not(.i){width:100%;height:auto;display:block}
.legend{display:flex;flex-direction:column;gap:6px}
.legend div{display:flex;gap:8px;align-items:center;font-size:12.5px}.legend i{width:10px;height:10px;border-radius:3px;flex:none}
/* cmdk */
.ck input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:none;outline:0}
.ck-l{max-height:55vh;overflow:auto;padding:6px}
.ck-i{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}.ck-i.on{background:var(--brs);color:var(--br)}
.kbd{border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:11px;background:var(--card2)}
/* lock */
.lock{position:fixed;inset:0;z-index:300;background:radial-gradient(800px 400px at 50% 0,#1e3a8a,#050c18);display:grid;place-items:center;color:#fff}
.lock .box{text-align:center;width:280px}.lock input{width:100%;text-align:center;font-size:26px;letter-spacing:10px;padding:12px;border-radius:14px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;margin:14px 0 6px}
/* mobile tab bar */
.tabbar{display:none}
.backdrop{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
 .lay{grid-template-columns:1fr}.side{position:fixed;right:0;top:0;z-index:60;width:270px;transform:translateX(105%);transition:.25s}.side.open{transform:none}
 .backdrop.on{display:block;position:fixed;inset:0;background:#0007;z-index:55}
 .burger{display:inline-flex}.gs{display:none}.hm{display:none}.content{padding:14px 12px 96px}.top{padding:10px 12px}
 .g2,.g3{grid-template-columns:1fr}.fg{grid-template-columns:1fr}.kpi .v{font-size:20px}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -8px 24px #0d1f3314}
 .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:10.5px;gap:2px;color:var(--mut);cursor:pointer;padding:4px 8px}
 .tabbar button.on{color:var(--br)}
 .tabbar .fab{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--br),var(--vio));color:#fff;margin-top:-26px;box-shadow:0 10px 24px #2563eb66;justify-content:center}
 .md{border-radius:20px 20px 0 0;align-self:end;max-height:94vh}.ov{padding:0;place-items:end stretch}
 .vdoc dl{grid-template-columns:100px 1fr}.t .hm{display:none}
}
/* print */
#pa{display:none}

function confirmBox(msg,yes='تأكيد',danger=true){return new Promise(res=>{openModal(`${mh('تأكيد')}<div class="mb"><p style="margin:0">${msg}</p></div><div class="mf"><div class="grow"></div><button class="btn" id="cb-n">إلغاء</button><button class="btn ${danger?'btn-out':'btn-p'}" id="cb-y" autofocus>${yes}</button></div>`,'s',ov=>{ov._x=()=>res(false);
  ov.querySelector('#cb-y').onclick=()=>{closeModal();res(true)};ov.querySelector('#cb-n').onclick=()=>{closeModal();res(false)};ov.querySelector('[data-act=close]').onclick=e=>{e.stopPropagation();closeModal();res(false)}},true)})}
function promptBox(title,label,type='text',hint=''){return new Promise(res=>{openModal(`${mh(title,'key')}<div class="mb"><div class="fd"><label>${label}</label><input id="pb-v" type="${type}" autofocus autocomplete="off">${hint?`<span class="h">${hint}</span>`:''}</div></div><div class="mf"><div class="grow"></div><button class="btn" id="pb-n">إلغاء</button><button class="btn btn-p" id="pb-y">متابعة</button></div>`,'s',ov=>{
  ov._x=()=>res(null);const y=()=>{const v=ov.querySelector('#pb-v').value;closeModal();res(v)};ov.querySelector('#pb-y').onclick=y;ov.querySelector('#pb-v').onkeydown=e=>{if(e.key==='Enter')y()};ov.querySelector('#pb-n').onclick=ov.querySelector('[data-act=close]').onclick=e=>{e.stopPropagation();closeModal();res(null)}},true)})}

/* ═════════ رسوم بيانية SVG ═════════ */
function barsSVG(data){/* [{l,a,b}] */const W=560,H=210,p=28,mx=Math.max(1,...data.flatMap(d=>[d.a,d.b]));const bw=(W-p*2)/data.length;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${[0,.25,.5,.75,1].map(k=>`<line x1="${p}" x2="${W-p}" y1="${H-30-(H-50)*k}" y2="${H-30-(H-50)*k}" stroke="var(--line)"/>`).join('')}
  ${data.map((d,i)=>{const x=p+i*bw+bw*.18,w=bw*.3,ha=(H-50)*d.a/mx,hb=(H-50)*d.b/mx;return `<g><rect x="${x}" y="${H-30-ha}" width="${w}" height="${ha}" rx="5" fill="#10b981"><title>قبض ${fmt(d.a)}</title></rect><rect x="${x+w+3}" y="${H-30-hb}" width="${w}" height="${hb}" rx="5" fill="#ef4444"><title>صرف ${fmt(d.b)}</title></rect><text x="${x+w}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--mut)">${d.l}</text></g>`}).join('')}</svg>`}
function donutSVG(parts){const tot=parts.reduce((s,x)=>s+x.v,0)||1;let a=-Math.PI/2;const R=70,r=46,c=90;
  const seg=parts.map(p=>{const da=p.v/tot*Math.PI*2;if(da>=Math.PI*2-1e-6)return `<circle cx="${c}" cy="${c}" r="${(R+r)/2}" stroke="${p.c}" stroke-width="${R-r}" fill="none"/>`;const a2=a+da,L=da>Math.PI?1:0;const P=(rr,an)=>`${c+rr*Math.cos(an)} ${c+rr*Math.sin(an)}`;
    const d=`M${P(R,a)}A${R} ${R} 0 ${L} 1 ${P(R,a2)}L${P(r,a2)}A${r} ${r} 0 ${L} 0 ${P(r,a)}Z`;a=a2;return `<path d="${d}" fill="${p.c}"><title>${esc(p.l)}: ${fmt(p.v)}</title></path>`}).join('');
  return `<svg viewBox="0 0 180 180" style="max-width:190px">${seg}<text x="90" y="86" text-anchor="middle" font-size="11" fill="var(--mut)">المصروفات</text><text x="90" y="104" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${fmt0(tot)}</text></svg>`}

/* ═════════ المساعد الذكي (تنبيهات ورؤى) ═════════ */
function backupDue(){const d=+S.settings.backupEvery||0;return d>0&&S.txns.length>0&&(now()-(S.meta.lastBackup||0))>d*864e5}
function insights(){const A=[],st=S.settings,T=todayISO();
  if(backupDue())A.push(['e','shield',S.meta.lastBackup?`آخر نسخة احتياطية ${ago(S.meta.lastBackup)} — احمِ بياناتك بنسخة ZIP الآن`:'لم تُنشئ أي نسخة احتياطية بعد — بياناتك محفوظة على هذا الجهاز فقط','backupNow','نسخ الآن']);
  const dr=S.txns.filter(t=>t.status==='draft').length;if(dr)A.push(['i','edit',`${dr} سند بحالة مسودة لا تدخل في الأرصدة`,'drafts','عرض']);
  for(const c of custs()){const s=custStats(c.id);
    if(c.limit>0&&s.bal>c.limit)A.push(['e','alert',`عهدة ${esc(c.name)} تجاوزت السقف (${fmt(s.bal)} من ${fmt(c.limit)})`,'stmtOf','كشف',c.id]);
    else if(c.limit>0&&s.bal>=c.limit*(st.limitWarn/100))A.push(['w','alert',`عهدة ${esc(c.name)} بلغت ${Math.round(s.bal/c.limit*100)}% من السقف`,'stmtOf','كشف',c.id]);
    if(s.bal<0)A.push(['w','scale',`${esc(c.name)} صرف أكثر من عهدته — مستحق له ${fmt(-s.bal)} ${cur()}`,'newIn','سند قبض',c.id]);
    if(s.oldest&&s.age>st.agingDays)A.push(['w','clock',`عهدة ${esc(c.name)} مفتوحة منذ ${s.age} يوماً دون تسوية (${fmt(s.bal)})`,'settle','تسوية',c.id])}
  const seen={};for(const t of S.txns)if(t.kind==='out'&&t.ref){const k=norm(t.ref)+'|'+t.amount;if(seen[k]){A.push(['w','copy',`فاتورة مكررة محتملة: المرجع ${esc(t.ref)} بمبلغ ${fmt(t.amount)}`,'open','فتح',t.id]);break}seen[k]=1}
  const m=T.slice(0,7),pm=addDays(m+'-01',-1).slice(0,7);const byC=(k)=>{const o={};for(const t of ok())if(isExp(t)&&t.date.startsWith(k))o[t.category||'أخرى']=(o[t.category||'أخرى']||0)+t.amount;return o};const cm=byC(m),cp=byC(pm);
  for(const c of S.categories)if(c.budget>0&&(cm[c.name]||0)>c.budget)A.push(['e','tag',`تجاوز ميزانية «${esc(c.name)}» هذا الشهر: ${fmt(cm[c.name])} من ${fmt(c.budget)}`]);
  const top=Object.entries(cm).sort((a,b)=>b[1]-a[1])[0];if(top){const ch=cp[top[0]]?Math.round((top[1]-cp[top[0]])/cp[top[0]]*100):null;A.push(['i','spark',`أعلى بند صرف هذا الشهر «${esc(top[0])}» بمبلغ ${fmt(top[1])}${ch!==null?` (${ch>=0?'+':''}${ch}% عن الشهر الماضي)`:''}`])}
  const last30=ok().filter(t=>isExp(t)&&t.date>addDays(T,-30)).reduce((s,t)=>s+t.amount,0);const out=custs().reduce((s,c)=>s+Math.max(0,custStats(c.id).bal),0);
  if(last30>0&&out>0){const days=Math.round(out/(last30/30));A.push(['ok','bolt',`معدل الصرف اليومي ${fmt(last30/30)} — الأرصدة القائمة (${fmt(out)}) تكفي قرابة ${days} يوماً`])}
  return A}
const alertHTML=a=>`<div class="alert ${a[0]}">${I(a[1])}<div class="grow">${a[2]}</div>${a[3]?`<button class="btn btn-s" data-act="${a[3]}" data-id="${a[5]||''}">${a[4]}</button>`:''}</div>`;

   <div class="row" style="justify-content:center"><button class="btn btn-p" data-act="custNew">${I('plus')} إضافة صاحب عهدة</button><button class="btn" data-act="pickFile">${I('up')} استعادة نسخة</button><button class="btn" data-act="demo">${I('spark')} بيانات تجريبية</button></div></div>`;
  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=isoOf(d).slice(0,7);const x=totals(L.filter(t=>t.date.startsWith(k)));months.push({l:MONTHS[d.getMonth()].slice(0,5),a:x.rinNet,b:x.exp})}
  const byCat={};for(const t of L)if(isExp(t)){const k=t.category||'أخرى';byCat[k]=(byCat[k]||0)+t.amount}
  const parts=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([l,v],i)=>({l,v,c:catOf(l)?.color||PAL[i%10]}));
  const recent=[...S.txns].sort((a,b)=>chron(b,a)).slice(0,7);const al=insights();
  const cl=custs().map(c=>({c,s:custStats(c.id)})).sort((a,b)=>b.s.bal-a.s.bal).slice(0,6);
  return hero+`<div class="grid g4 mt">
   <div class="card kpi k-in"><div class="l">${I('in')} إجمالي المقبوض (وارد)</div><div class="v num c-in">${fmt(T.rinNet)}</div><div class="s">${L.filter(t=>t.kind==='in'&&!isCarry(t)).length} سند قبض</div></div>
   <div class="card kpi k-out"><div class="l">${I('out')} إجمالي المصروفات</div><div class="v num c-out">${fmt(T.exp)}</div><div class="s">${T.ref?`+ رد للصندوق ${fmt(T.ref)}`:`${L.filter(isExp).length} سند صرف`}</div></div>
   <div class="card kpi k-bal"><div class="l">${I('scale')} الرصيد القائم لدى العهد</div><div class="v num">${fmt(outst)}</div><div class="s">${custs().length} صاحب عهدة نشط</div></div>
   <div class="card kpi k-v"><div class="l">${I('chart')} مصروفات ${MONTHS[+m.slice(5)-1]}</div><div class="v num">${fmt(tm.exp)}</div><div class="s">${ch===null?'لا مقارنة':`<b class="${ch>0?'c-out':'c-in'}">${ch>0?'▲':'▼'} ${Math.abs(ch)}%</b> عن الشهر الماضي`}</div></div></div>
  <div class="grid g21 mt"><div class="card chart"><h3>${I('chart')} القبض والصرف — آخر 6 أشهر <span class="grow"></span><span class="bd bd-in">قبض</span><span class="bd bd-out">صرف</span></h3>${barsSVG(months)}</div>
   <div class="card"><h3>${I('spark')} المساعد الذكي</h3>${al.length?al.slice(0,6).map(alertHTML).join(''):`<div class="alert ok">${I('check')}<div>كل شيء على ما يرام — لا تنبيهات</div></div>`}</div></div>

function custCard(c){const s=custStats(c.id),pc=c.limit?Math.round(s.bal/c.limit*100):0,cy=c.cycle||1,pv=custById(c.prevId),nx=custById(c.nextId),closed=!!nx;

async function handleFile(file){if(!file)return;const ext=file.name.split('.').pop().toLowerCase();
  try{if(ext==='xls')throw new Error('صيغة XLS القديمة غير مدعومة — احفظ الملف من Excel بصيغة XLSX أو CSV');
    if(['csv','tsv','txt'].includes(ext))return openImport([{name:file.name,rows:Csv.parse(await file.text())}],file.name);
    if(ext==='json')return previewRestore(JSON.parse(await file.text()),{src:file.name,kind:'JSON'});
    const buf=await file.arrayBuffer();const head=new Uint8Array(buf.slice(0,2));
    if(head[0]===0x7B||head[0]===0xEF)return previewRestore(JSON.parse(new TextDecoder().decode(buf)),{src:file.name,kind:'JSON'});
    if(!(head[0]===0x50&&head[1]===0x4B))throw new Error('صيغة غير معروفة — المدعوم: ZIP · JSON · XLSX · CSV · TSV');
    const z=await Zip.read(buf);
    if(z.names.includes('xl/workbook.xml'))return openImport(await Xlsx.read(buf),file.name);
    if(z.names.includes('manifest.json')){const man=JSON.parse(await z.text('manifest.json'));let js,integ=null;
      if(man.encrypted){const pw=await promptBox('نسخة مشفّرة','أدخل كلمة مرور النسخة','password','النسخة محمية بتشفير AES-256');if(pw===null)return;const raw=await z.get('data.enc');integ=man.sha256?(await sha256(raw))===man.sha256:null;js=dec(await Vault.unlock(raw,pw,man.salt,man.iv))}
      else{js=await z.text('data.json');if(!js)throw new Error('ملف data.json مفقود داخل النسخة');integ=man.sha256?(await sha256(js))===man.sha256:null}
      const data=JSON.parse(js);let miss=0;for(const t of data.txns||[])if(t.att&&t.att.path&&!t.att.data){const b=await z.get(t.att.path);if(b)t.att={name:t.att.name,type:t.att.type||typeOfExt(t.att.path),data:await bytesToDataUrl(b,t.att.type||typeOfExt(t.att.path))};else{t.att=null;miss++}}
      return previewRestore(data,{src:file.name,kind:man.encrypted?'ZIP مشفّر':'ZIP',integ,man,miss})}
    const j=z.names.find(n=>/\.json$/i.test(n));if(j)return previewRestore(JSON.parse(await z.text(j)),{src:file.name+' ← '+j,kind:'ZIP'});
    const x=z.names.find(n=>/\.xlsx$/i.test(n));if(x){const b=await z.get(x);return openImport(await Xlsx.read(b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength)),x)}
    const c=z.names.find(n=>/\.(csv|tsv|txt)$/i.test(n));if(c)return openImport([{name:c,rows:Csv.parse(await z.text(c))}],c);
    throw new Error('لم يُعثر داخل الأرشيف على نسخة أو جدول قابل للاستيراد')}
  catch(e){console.error(e);toast(e.message||'تعذر قراءة الملف','err')}}

const FIELDS={date:['التاريخ',['تاريخ','date']],no:['رقم السند',['رقم السند','رقم القيد','السند','voucher','no','رقم']],kind:['النوع',['النوع','نوع الحركه','نوع','type','kind']],cust:['صاحب العهدة',['صاحب العهده','العهده','الموظف','المستلم','المندوب','الاسم','custodian','employee','name']],

  amount:['المبلغ',['المبلغ','القيمه','مبلغ','amount','value','total']],balance:['الرصيد',['الرصيد','الرصيد بعد الحركة','رصيد بعد الحركة','الرصيد الختامي','balance','running balance','ending balance']],category:['التصنيف',['التصنيف','البند','الفئه','نوع المصروف','category']],ref:['المرجع',['المرجع','رقم المرجع','رقم مرجع','مرجع','رقم الفاتوره','فاتوره','ref','invoice']],method:['طريقة الدفع',['طريقه الدفع','الدفع','method']],

function autoMap(heads){const m={},taken=new Set();const H=heads.map(norm);const score=(h,keys)=>{let b=0;for(const k of keys){const nk=norm(k);if(h===nk)b=Math.max(b,100+nk.length);else if(nk.length>=3&&h.includes(nk))b=Math.max(b,nk.length);else if(nk.length<3&&new RegExp('(^|[^a-z])'+nk+'([^a-z]|$)').test(h))b=Math.max(b,1)}return b};
  const cand=[];for(const[f,[,keys]]of Object.entries(FIELDS))H.forEach((h,i)=>{const s=score(h,keys);if(s)cand.push([s,f,i])});cand.sort((a,b)=>b[0]-a[0]);
  for(const[,f,i]of cand)if(!(f in m)&&!taken.has(i)){m[f]=i;taken.add(i)}return m}
function detectHeader(rows){let best=0,bs=-1;rows.slice(0,15).forEach((r,i)=>{const s=Object.keys(autoMap(r.map(String))).length;if(s>bs){bs=s;best=i}});return best}

function impBuild(){const im=UI.imp,m=im.map,o=im.opt,g=(r,f)=>m[f]!=null&&m[f]!==''?r[m[f]]:'';const out=[],skip=[];let dup=0;const newC={},keys=new Set(S.txns.map(t=>t.date+'|'+t.amount+'|'+norm(t.desc)));
  let source=im.rows.map((r,i)=>({r,i}));const balanceOnly=m.balance!=null&&m.in==null&&m.out==null&&m.amount==null;if(balanceOnly&&m.date!=null)source.sort((a,b)=>(parseDate(g(a.r,'date'))||'').localeCompare(parseDate(g(b.r,'date'))||'')||a.i-b.i);let prevBalance=null;
  for(const item of source){const r=item.r,desc=String(g(r,'desc')??'').trim(),nd=norm(desc),rawBal=g(r,'balance'),hasBal=m.balance!=null&&rawBal!==''&&rawBal!=null,balance=hasBal?r2(parseNum(rawBal)):null;
    if(/^(الاجمالي|اجمالي|المجموع|total)/.test(nd)||(/^(الاجمالي|اجمالي|المجموع|total)/.test(norm(String(r[0]??''))))||(/^رصيد/.test(nd)&&!hasBal)){skip.push('إجمالي');continue}
    let a=r2(parseNum(g(r,'in'))),b=r2(parseNum(g(r,'out'))),kind='',amt=0,fromBalance=false;const rawAmount=g(r,'amount'),kindText=norm(String(g(r,'kind')||''));
    if(a<0){b=r2(b-a);a=0}if(b<0){a=r2(a-b);b=0}

    else if(rawAmount!==''&&rawAmount!=null&&r2(parseNum(rawAmount))!==0){amt=r2(parseNum(rawAmount));if(amt<0){amt=-amt;kind='out'}if(/(قبض|وارد|مدين|تعزيز|استلام|in|receipt|debit)/.test(kindText)&&!/(سند صرف|منصرف|مصروف)/.test(kindText))kind='in';else if(kindText)kind='out'}
    else if(hasBal){fromBalance=true;const delta=r2(balance-(prevBalance==null?0:prevBalance));if(delta>0){kind='in';amt=delta}else if(delta<0){kind='out';amt=-delta}}

/* ═════════ PDF A4 مباشر بلا مكتبات: يرسم الصفحات بمحرك المتصفح ثم يكتب ملف PDF ═════════ */
function pdfBuild(pages,pw,ph){const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);push(body);push('\nendobj\n')};
  const stream=(n,dict,bytes)=>{offs[n]=len;push(`${n} 0 obj\n<< ${dict} /Length ${bytes.length} >>\nstream\n`);push(bytes);push('\nendstream\nendobj\n')};
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] >>`);
  pages.forEach((pg,i)=>{const P=3+i*3,C=P+1,I=P+2;
    obj(P,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}] /Resources << /XObject << /Im0 ${I} 0 R >> >> /Contents ${C} 0 R >>`);
    stream(C,'',enc.encode(`q ${pw.toFixed(2)} 0 0 ${ph.toFixed(2)} 0 0 cm /Im0 Do Q`));
    stream(I,`/Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`,pg.bytes)});
  const N=3+pages.length*3,xr=len;push(`xref\n0 ${N}\n0000000000 65535 f \n`);for(let n=1;n<N;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
async function pdfRender(html,{landscape=true,margin=28,scale=2}={}){
  const W=landscape?1123:794,H=landscape?794:1123,CW=W-margin*2,CH=H-margin*2;
  const host=document.createElement('div');host.setAttribute('dir','rtl');host.style.cssText=`position:fixed;left:-99999px;top:0;width:${CW}px;background:#fff;color:#000;font-family:${PDF_FONT};font-size:12px;line-height:1.55`;
  host.innerHTML=`<style>${PDF_CSS}</style><div class="pd" id="pdf-c">${latinDigits(html)}</div>`;document.body.appendChild(host);
  try{await Promise.all([...host.querySelectorAll('img')].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r})));if(document.fonts?.ready)await document.fonts.ready;
    const c=host.querySelector('#pdf-c'),top=c.getBoundingClientRect().top,total=Math.ceil(c.getBoundingClientRect().height);
    const cands=[...new Set([...c.querySelectorAll('tr,.ph,.sg,.vr,.pv,.row')].map(e=>Math.round(e.getBoundingClientRect().bottom-top)))].sort((a,b)=>a-b);
    const starts=[0];let st=0;while(st+CH<total-1){let e=0;for(const y of cands)if(y>st+40&&y<=st+CH)e=y;if(!e)e=st+CH;st=e;starts.push(st)}
    const ser=new XMLSerializer(),inner=[...host.childNodes].map(n=>ser.serializeToString(n)).join('');
    const pages=[];
    for(let k=0;k<starts.length;k++){const s0=starts[k],hh=Math.min(CH,(k+1<starts.length?starts[k+1]:total)-s0)+2;
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="width:${W}px;height:${H}px;background:#fff;position:relative;overflow:hidden;font-family:${PDF_FONT};font-size:12px;line-height:1.55;color:#000"><div style="position:absolute;left:${margin}px;top:${margin}px;width:${CW}px;height:${hh}px;overflow:hidden"><div style="position:absolute;left:0;top:${-s0}px;width:${CW}px">${inner}</div></div></div></foreignObject></svg>`;
      const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
      try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('تعذر رسم الصفحة'));img.src=url});
        const cv=document.createElement('canvas');cv.width=W*scale;cv.height=H*scale;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
        const blob=await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('تعذر إنشاء صورة الصفحة')),'image/jpeg',.92));
        pages.push({bytes:new Uint8Array(await blob.arrayBuffer()),w:cv.width,h:cv.height})}finally{URL.revokeObjectURL(url)}}
    return pdfBuild(pages,landscape?841.89:595.28,landscape?595.28:841.89)}finally{host.remove()}}
async function pdfDoc(html,{landscape=false,name='document.pdf',share=false,text='',phone=''}={}){toast('جارٍ تجهيز PDF…');
  try{const blob=await pdfRender(html,{landscape});
    if(share){await shareFile(blob,name,'application/pdf',text,phone);return}

/* ═════════ تصفية العهدة وترحيل الرصيد إلى عهدة جديدة ═════════ */
/* قيدان مترابطان بنفس الرقم والتاريخ والمبلغ: «رصيد مرحّل» يُصفّر العهدة السابقة، و«رصيد منقول» يفتتح الجديدة.
   يُعاد احتسابهما تلقائياً عند أي تعديل في العهدة السابقة (وعبر السلسلة كاملة). */
function syncCarry(){if(!S)return;const L=S.custodians.filter(c=>c.nextId).sort((a,b)=>(a.cycle||1)-(b.cycle||1));
  for(const c of L){const n=custById(c.nextId);if(!n){c.nextId='';c.closedAt='';continue}
    let o=S.txns.find(t=>isCarry(t)&&t.custodianId===c.id&&t.carryTo===n.id),i=S.txns.find(t=>isCarry(t)&&t.custodianId===n.id&&t.carryFrom===c.id);
    const b=r2(S.txns.filter(t=>t.custodianId===c.id&&t.status!=='draft'&&t!==o).reduce((s,t)=>s+sgn(t),0));
    if(Math.abs(b)<.005){if(o||i)S.txns=S.txns.filter(t=>t!==o&&t!==i);continue}
    const date=c.closedAt||todayISO(),no=o?.no||i?.no||nextNo('carry',date),a=Math.abs(b),cy=c.cycle||1,ko=b>0?'out':'in',ki=b>0?'in':'out';
    const base={no,date,amount:a,category:'',method:'ترحيل',ref:'',project:'',notes:c.rollNote||'',status:'approved',att:null,sys:'carry'};
    const chg=x=>!x||x.amount!==a||x.date!==date;
    if(!o){o={id:uid(),createdAt:9999999999000,enteredAt:now()};S.txns.push(o)}if(!i){i={id:uid(),createdAt:1,enteredAt:now()};S.txns.push(i)}
    const upd=chg(o)||chg(i);
    Object.assign(o,base,{kind:ko,custodianId:c.id,carryTo:n.id,carryFrom:'',link:i.id,desc:`رصيد مرحّل من ${custNo(c)} إلى ${custNo(n)}`});
    Object.assign(i,base,{kind:ki,custodianId:n.id,carryFrom:c.id,carryTo:'',link:o.id,desc:`رصيد منقول من ${custNo(c)} إلى ${custNo(n)}`});
    if(upd||!o.updatedAt){o.updatedAt=i.updatedAt=now()}}}

function readLogoFile(f){return new Promise((resolve,reject)=>{if(!f||!/^image\/(png|jpeg|webp)$/.test(f.type))return reject(new Error('اختر شعارًا بصيغة PNG أو JPG أو WEBP'));if(f.size>5*1024*1024)return reject(new Error('حجم الشعار أكبر من 5MB'));const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=520;cv.height=180;const k=Math.min(500/img.naturalWidth,160/img.naturalHeight,1),w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));cv.getContext('2d').drawImage(img,(520-w)/2,(180-h)/2,w,h);URL.revokeObjectURL(url);resolve(cv.toDataURL('image/png'))}catch(e){URL.revokeObjectURL(url);reject(new Error('تعذر تجهيز الشعار'))}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('تعذر قراءة صورة الشعار'))};img.src=url})}

/* ═════════ الأحداث ═════════ */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;const a=el.dataset.act;if(!ACT[a])return;if(el.tagName==='A')e.preventDefault();e.stopPropagation();ACT[a](el.dataset,el)});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if(e.key==='Escape'&&$('.ov')){closeModal();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk();return}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&$('#tx-amt')){e.preventDefault();saveTx(false);return}
  if(e.key==='Enter'&&e.target.id==='qi'){ACT.quick();return}
  if(e.key==='Enter'&&e.target.id==='gs'){UI.f.q=e.target.value;go('vouchers');return}
  if(typing||$('.ov')||$('#lock')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();($('#gs')||$('#f-q'))?.focus()}else if(e.key==='n'||e.key==='ى'){e.preventDefault();openTxn(null,{kind:'out'})}else if(e.key==='r'||e.key==='ق'){e.preventDefault();openTxn(null,{kind:'in'})}});
document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault()});
document.addEventListener('drop',e=>{if(!e.dataTransfer?.files?.length)return;e.preventDefault();handleFile(e.dataTransfer.files[0])});
window.addEventListener('beforeunload',()=>{if(saveT)saveNow()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)saveNow()});

/* ═════════ التشغيل ═════════ */
startLatinDigitGuard();
(async()=>{await loadState();ensureCustSerials();await saveNow();render();setInterval(updateDockClock,1000);showLock();
  if(UI.migrated)setTimeout(()=>toast(`✓ تم ترحيل بياناتك من «عُهدة سحابية» تلقائياً (${S.txns.length} سند)`,'ok'),400);
  try{if(navigator.storage?.persist)navigator.storage.persist()}catch(e){}
  setTimeout(()=>Snap.daily(),1500)})();


/* عدّاد متحرك للأرقام الرئيسية */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;let arm=true,q=0;setTimeout(()=>arm=false,1800);
document.addEventListener('click',e=>{if(e.target.closest('.nav,.tabbar button')){arm=true;setTimeout(()=>arm=false,700)}});
const run=()=>{q=0;if(!arm||typeof fmt!=='function')return;document.querySelectorAll('.kpi .v.num:not([data-cu])').forEach(el=>{el.dataset.cu=1;const tx=el.textContent.trim(),n=parseFloat(tx.replace(/[^\d.\-]/g,''));if(!isFinite(n)||!n||fmt(n)!==tx)return;const t0=performance.now();const st=now=>{const p=Math.min(1,(now-t0)/650),e=1-Math.pow(1-p,3);el.textContent=p<1?fmt(Math.round(n*e*100)/100):tx;if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})};
new MutationObserver(()=>{if(!q)q=requestAnimationFrame(run)}).observe(document.body,{childList:true,subtree:true})})();
</script>
